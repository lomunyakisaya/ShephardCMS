{% extends 'auth/auth.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Welcome Back</h1>
    <p>Login to continue</p>

    <form method="post">
        {% csrf_token %}

        <div class="input-group">
            <input type="text" name="username" placeholder="Username or Email" required>
        </div>

        <div class="input-group password-group">
            <input type="password" id="loginPassword" name="password" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</button>
        </div>

        <button type="submit" class="submit-btn" style="background:#2196f3;">Login</button>
    </form>

    <p class="toggle-auth">
        Don't have an account?
        <a href="{% url 'register' %}" class="link-btn">Sign Up</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
    btn.textContent = input.type === "password" ? "Show" : "Hide";
}
</script>
{% endblock %}
