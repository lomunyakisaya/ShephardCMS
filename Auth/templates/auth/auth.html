<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication{% endblock %}</title>

    <style>
        :root {
            --primary: #2a5298;
            --secondary: #1e3c72;
            --accent: #4f9cff;
            --success: #28a745;
            --error: #dc3545;
            --warning: #ffc107;
            --text-light: #f5f7fa;
            --text-muted: #b0b8c1;
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: var(--text-light);
        }

        .auth-container {
            width: 100%;
            padding: 20px;
        }

        /* Messages */
        .messages {
            max-width: 420px;
            margin: 0 auto 20px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .message.success {
            background: rgba(40, 167, 69, 0.15);
            border-left: 4px solid var(--success);
        }

        .message.error {
            background: rgba(220, 53, 69, 0.15);
            border-left: 4px solid var(--error);
        }

        .message.warning {
            background: rgba(255, 193, 7, 0.2);
            border-left: 4px solid var(--warning);
            color: #000;
        }

        /* Card */
        .auth-card {
            max-width: 420px;
            margin: auto;
            padding: 35px 30px;
            border-radius: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .auth-card h1 {
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .auth-card p {
            margin-bottom: 25px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Inputs */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.15);
        }

        .input-group input::placeholder {
            color: #cbd3da;
        }

        .password-group {
            display: flex;
        }

        .password-group input {
            flex: 1;
        }

        .toggle-password {
            margin-left: 8px;
            padding: 0 14px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-password:hover {
            opacity: 0.85;
        }

        /* Button */
        .submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: var(--accent);
            color: white;
            transition: 0.25s;
        }

        .submit-btn:hover {
            background: #3b82f6;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Links */
        .link-btn {
            color: #ffd700;
            text-decoration: none;
            font-weight: 500;
        }

        .link-btn:hover {
            text-decoration: underline;
        }

        .toggle-auth {
            margin-top: 18px;
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="auth-container">

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}

</div>

{% block extra_js %}{% endblock %}

</body>
</html>
