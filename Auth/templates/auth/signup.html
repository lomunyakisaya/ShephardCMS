{% extends 'auth/auth.html' %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Join Our Church Family</h1>
    <p>Create your account</p>

    <form method="post">
        {% csrf_token %}

        <div class="input-group">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="input-group password-group">
            <input type="password" id="signupPassword" name="password" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('signupPassword', this)">Show</button>
        </div>

        <div class="input-group password-group">
            <input type="password" id="signupPassword2" name="password2" placeholder="Confirm Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('signupPassword2', this)">Show</button>
        </div>

        <button type="submit" class="submit-btn" style="background:#00c853;">Sign Up</button>
    </form>

    <p class="toggle-auth">
        Already have an account?
        <a href="{% url 'login' %}" class="link-btn">Login</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
    btn.textContent = input.type === "password" ? "Show" : "Hide";
}
</script>
{% endblock %}
