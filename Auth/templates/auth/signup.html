{% extends 'auth/auth.html' %}
{%load static%}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-card church-card">
    <h1>Join Our Church Family</h1>
    <p>Sign up to stay connected and receive updates.</p>

    <form method= "post"id="signupForm" onsubmit="handleSignup(event)">
        {% csrf_token %}
        <div class="input-group">
            <input type="text" id="username" name="username" placeholder="Username" required>
        <div class="input-group">
            <input type="email" id="signupEmail" name="email"placeholder="Email" required>
        </div>
        <div class="input-group password-group">
            <input type="password" id="signupPassword" name="password" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('signupPassword', this)">Show</button>
        </div>
        <div class="input-group password-group">
            <input type="password" id="signupPassword" name="password2" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('signupPassword', this)">Show</button>
        </div>
        <button type="submit" class="submit-btn">Sign Up</button>
    </form>

    <p class="toggle-auth">
        Already a member? 
        <a href="{% url 'login' %}" class="link-btn">Log in here</a>
    </p>
</div>
{% endblock %}
